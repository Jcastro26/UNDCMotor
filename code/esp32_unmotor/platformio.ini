; =============================================================================
;  Laboratorio de Control - Universidad Nacional de Colombia
;  Planta Motor DC (UNDCMotor)
;  Configuracion ajustada para macOS (Apple Silicon)
;
;  Cambios respecto al archivo original y por que:
;   1) platform: antes apuntaba a la rama git "develop" del repo de PlatformIO.
;      Ese paquete quedo a medio instalar (le falta el manifiesto .piopm), asi
;      que PlatformIO intentaba RE-CLONAR todo el repositorio en CADA
;      compilacion -> por eso se quedaba "compilando" 30 minutos o mas.
;      Ahora se usa una version publicada y fija (Arduino core 2.0.17, que es
;      el que necesita este firmware por usar ledcSetup/ledcAttachPin).
;   2) build_dir / libdeps_dir / build_cache_dir: se sacan de OneDrive.
;      OneDrive intenta sincronizar los miles de archivos .o intermedios y
;      eso congela la compilacion en Mac.
;   3) upload_speed: 2000000 y 921600 baudios son inestables con el puente
;      USB-serial de esta placa/cable en macOS (falla "No serial data
;      received" justo al subir la velocidad). 115200 es mas lento pero
;      confiable. Aun asi, la conexion es fisicamente inestable: un intento
;      de upload se corto a mitad de camino y el siguiente funciono. Si
;      un upload falla, reintentar; si falla seguido, probar otro cable
;      USB-C (de datos, no solo carga) y conectar directo al puerto del
;      Mac sin hub/dock intermedio.
;   4) upload_port / monitor_port: en macOS los puertos son /dev/cu.* ,
;      no COM3. Se usa un comodin para no tener que editar el numero cada vez.
;
;  Copia del archivo original: platformio.ini.bak-original
; =============================================================================

[platformio]
default_envs = esp32-s3-devkitc-1
name = DCMotor_IoT
description = Control de un motor DC por IoT

; --- Todo lo generado durante la compilacion vive FUERA de OneDrive ---
build_dir       = ${platformio.core_dir}/build/unmotor
libdeps_dir     = ${platformio.core_dir}/libdeps/unmotor
build_cache_dir = ${platformio.core_dir}/build_cache

[env:esp32-s3-devkitc-1]
; Version fija y publicada del platform (NO usar la URL de git)
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
framework = arduino

lib_deps =
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0
	madhephaestus/ESP32Encoder@^0.10.2
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.0.2
	adafruit/Adafruit NeoPixel@^1.12.0

; --- Puerto serial en macOS -------------------------------------------------
; Comodin: toma el primer /dev/cu.*serial* que encuentre (CH340/CP2102/FTDI).
; Si tu planta aparece como /dev/cu.usbmodemXXXX (USB nativo del ESP32-S3),
; comenta las dos lineas de abajo y descomenta las dos siguientes.
upload_port  = /dev/cu.*serial*
monitor_port = /dev/cu.*serial*
; upload_port  = /dev/cu.usbmodem*
; monitor_port = /dev/cu.usbmodem*

upload_speed = 115200
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
